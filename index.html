<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Image Processing</title>
    <style>
        body {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1e1b4b 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(50px); z-index: -1;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 28px; padding: 50px 30px;
            width: 100%; max-width: 440px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4); text-align: center;
        }
        .upload-trigger {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: #ffffff;
            padding: 24px 40px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 18px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none; outline: none; width: 80%; margin-bottom: 35px;
        }
        .upload-trigger:hover {
            transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 30px rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
        }
        .upload-icon { font-size: 28px; }
        .upload-trigger span { margin-top: 8px; }
        .ad-container { border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 25px; }
        .ad-text { color: #e2e8f0; font-size: 16px; font-weight: 500; line-height: 1.6; margin: 0 0 12px 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .ad-highlight { background: linear-gradient(to right, #6366f1, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        #file-input { display: none; }
        .status-message { margin-top: 20px; font-size: 14px; font-weight: 500; display: none; color: #a5b4fc; }
    </style>
</head>
<body>

    <div class="main-card">
        <button class="upload-trigger" onclick="document.getElementById('file-input').click()">
            <div class="upload-icon">📸</div>
            <span>Upload an Image</span>
        </button>
        
        <input type="file" id="file-input" accept="image/*">

        <div class="ad-container">
            <p class="ad-text">✨ আপনার ছবিটিকে একদম <span class="ad-highlight">প্রফেশনাল এডিট</span> করে দেওয়া হবে।</p>
            <p class="ad-text">👔 মুহূর্তের মধ্যে পরিবর্তন করুন আপনার <span class="ad-highlight">ড্রেস বা ব্যাকগ্রাউন্ড</span>!</p>
        </div>

        <div id="status" class="status-message"></div>
    </div>

    <script>
        // ⚠️ আপনার ImgBB API Key টি শুধুমাত্র এখানে বসাবেন
        const IMGBB_API_KEY = 'b0bba5ebbca06eb7e71552b83b9aa879'; 

        const fileInput = document.getElementById('file-input');
        const statusMessage = document.getElementById('status');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0]; // সংশোধিত: প্রথম ফাইলটি নেওয়ার জন্য [0] যুক্ত করা হয়েছে
            if (file) { processAndUpload(file); }
        });

        function processAndUpload(file) {
            statusMessage.style.display = 'block';
            statusMessage.style.color = '#a5b4fc';
            statusMessage.innerText = 'Uploading and processing your image...';

            const formData = new FormData();
            formData.append('image', file);

            fetch(`https://imgbb.com{IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusMessage.style.color = '#10b981';
                    statusMessage.innerText = '🎉 Image uploaded successfully!';
                    console.log("Uploaded Image URL:", data.data.url); 
                } else { throw new Error('Upload failed'); }
            })
            .catch(error => {
                statusMessage.style.color = '#ef4444';
                statusMessage.innerText = '❌ Something went wrong. Please try again.';
                console.error(error);
            });
        }
    </script>
</body>
</html>
